<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1e1e1e"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="40" text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" font-size="28" font-weight="600" fill="#1e1e1e">AI-native Engineering Pipeline</text>
  <text x="600" y="68" text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" font-size="15" fill="#757575">Intent verifiable · Artifacts auditable · Humans hold merge &amp; release</text>

  <rect x="40" y="90" width="1120" height="150" rx="12" fill="#dbe4ff" fill-opacity="0.55" stroke="#4a9eed" stroke-width="1"/>
  <text x="56" y="114" font-family="Inter,Helvetica,Arial,sans-serif" font-size="16" fill="#2563eb">1. Upstream intent</text>
  <g font-family="Inter,Helvetica,Arial,sans-serif" font-size="17" text-anchor="middle">
    <rect x="70" y="140" width="170" height="72" rx="10" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="1.5"/>
    <text x="155" y="183" fill="#1e1e1e">Discovery</text>
    <path d="M250 176 H290" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="300" y="140" width="150" height="72" rx="10" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="1.5"/>
    <text x="375" y="183" fill="#1e1e1e">PRD</text>
    <path d="M460 176 H500" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="510" y="140" width="190" height="72" rx="10" fill="#fff3bf" stroke="#1e1e1e" stroke-width="1.5"/>
    <text x="605" y="183" fill="#1e1e1e">Spec + Rules</text>
    <path d="M710 176 H750" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="760" y="140" width="150" height="72" rx="10" fill="#fff3bf" stroke="#1e1e1e" stroke-width="1.5"/>
    <text x="835" y="183" fill="#1e1e1e">Plan</text>
  </g>

  <path d="M835 212 V265" stroke="#1e1e1e" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="40" y="270" width="1120" height="150" rx="12" fill="#e5dbff" fill-opacity="0.55" stroke="#8b5cf6" stroke-width="1"/>
  <text x="56" y="294" font-family="Inter,Helvetica,Arial,sans-serif" font-size="16" fill="#6d28d9">2. Build &amp; verify (loop)</text>
  <g font-family="Inter,Helvetica,Arial,sans-serif" font-size="17" text-anchor="middle">
    <rect x="70" y="320" width="200" height="72" rx="10" fill="#d0bfff" stroke="#1e1e1e" stroke-width="1.5"/>
    <text x="170" y="363" fill="#1e1e1e">Coding / Test</text>
    <path d="M280 356 H320" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="330" y="320" width="150" height="72" rx="10" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="1.5"/>
    <text x="405" y="363" fill="#1e1e1e">Security</text>
    <path d="M490 356 H530" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="540" y="320" width="150" height="72" rx="10" fill="#d0bfff" stroke="#1e1e1e" stroke-width="1.5"/>
    <text x="615" y="363" fill="#1e1e1e">CR || CI</text>
    <path d="M700 356 H740" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="750" y="320" width="150" height="72" rx="10" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="1.5"/>
    <text x="825" y="363" fill="#1e1e1e">Preview</text>
  </g>

  <path d="M825 392 V435 H140 V495" stroke="#1e1e1e" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="40" y="450" width="700" height="150" rx="12" fill="#d3f9d8" fill-opacity="0.55" stroke="#22c55e" stroke-width="1"/>
  <text x="56" y="474" font-family="Inter,Helvetica,Arial,sans-serif" font-size="16" fill="#15803d">3. Release (human gate)</text>
  <g font-family="Inter,Helvetica,Arial,sans-serif" font-size="17" text-anchor="middle">
    <rect x="70" y="500" width="130" height="72" rx="10" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="1.5"/>
    <text x="135" y="543" fill="#1e1e1e">Merge</text>
    <path d="M210 536 H245" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="255" y="500" width="130" height="72" rx="10" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="1.5"/>
    <text x="320" y="543" fill="#1e1e1e">Release</text>
    <path d="M395 536 H430" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="440" y="500" width="110" height="72" rx="10" fill="#c3fae8" stroke="#1e1e1e" stroke-width="1.5"/>
    <text x="495" y="543" fill="#1e1e1e">Ops</text>
    <path d="M560 536 H595" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="605" y="500" width="115" height="72" rx="10" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="1.5"/>
    <text x="662" y="543" fill="#1e1e1e">Incident</text>
  </g>

  <rect x="780" y="450" width="380" height="150" rx="12" fill="#eebefa" stroke="#ec4899" stroke-width="2"/>
  <text x="970" y="510" text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" font-size="18" fill="#1e1e1e">CO (Change Ops)</text>
  <text x="970" y="540" text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" font-size="16" fill="#1e1e1e">across the whole chain</text>

  <text x="56" y="660" font-family="Inter,Helvetica,Arial,sans-serif" font-size="15" fill="#757575">Gates: Spec before code · Full tests before PR · Independent review · Human merge &amp; release</text>
</svg>
